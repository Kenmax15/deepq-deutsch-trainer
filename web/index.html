<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DeepQ Deutsch Trainer · Brot kaufen</title>
<meta name="description" content="Mission A1 « Brot kaufen » : achète du pain dans une boulangerie allemande et entraîne-toi à parler allemand.">
<meta name="theme-color" content="#14110f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='36' r='22' fill='%2337c9a7'/%3E%3Ccircle cx='24' cy='34' r='4' fill='%23123'/%3E%3Ccircle cx='40' cy='34' r='4' fill='%23123'/%3E%3Cpath d='M32 14V6' stroke='%23123' stroke-width='3'/%3E%3Ccircle cx='32' cy='6' r='4' fill='%23f2b33d'/%3E%3C/svg%3E">
<link rel="preload" href="img/street.webp" as="image">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="app">
  <!-- scene photos (cross-faded) -->
  <div class="scene" id="scene">
    <div class="bg" id="bgA"></div>
    <div class="bg" id="bgB"></div>
    <div class="shade"></div>
  </div>

  <!-- top bar -->
  <header class="topbar" id="topbar" hidden>
    <button class="chip" id="objBtn" aria-expanded="false" aria-controls="objPanel">
      <span class="dots" id="objDots"></span><span id="objLabel"></span>
    </button>
    <div class="top-right">
      <button class="icon-btn" id="soundBtn" aria-label="Son"></button>
      <button class="icon-btn" id="settingsBtn" aria-label="Réglages">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/></svg>
      </button>
    </div>
    <div class="obj-panel" id="objPanel" hidden>
      <h2 id="objTitle"></h2>
      <ul id="objList"></ul>
    </div>
  </header>

  <!-- title screen -->
  <section class="screen title-screen" id="titleScreen">
    <div class="title-card">
      <p class="brand"><span class="qubi-mini" aria-hidden="true"></span>DeepQ Deutsch Trainer</p>
      <p class="kicker" data-i18n="mission_kicker"></p>
      <h1>Brot kaufen</h1>
      <p class="goal" id="goalText"></p>
      <ul class="facts">
        <li data-i18n="fact_time"></li>
        <li data-i18n="fact_audio"></li>
        <li data-i18n="fact_free"></li>
      </ul>
      <div class="actions">
        <button class="btn primary" id="startBtn" data-i18n="start"></button>
        <button class="btn ghost" id="resumeBtn" data-i18n="resume" hidden></button>
      </div>
      <div class="lang-switch" role="group" aria-label="Langue / Language">
        <button data-lang="fr">Français</button><button data-lang="en">English</button>
      </div>
    </div>
  </section>

  <!-- story / dialogue layer -->
  <section class="stage" id="stage" hidden>
    <div class="context" id="context" aria-live="polite"></div>

    <div class="sheet" id="sheet">
      <div class="qubi-bubble" id="qubiBubble" hidden>
        <div class="qubi" aria-hidden="true"><i></i></div>
        <p id="qubiText"></p>
      </div>

      <div class="log" id="log" aria-live="polite"></div>

      <div class="answer" id="answer" hidden>
        <p class="answer-label" id="answerLabel"></p>
        <div class="choices" id="choices"></div>
        <form class="free" id="freeForm" autocomplete="off">
          <input id="freeInput" type="text" spellcheck="false" lang="de" enterkeyhint="send">
          <button class="btn small" type="submit" data-i18n="send"></button>
        </form>
        <div class="tools">
          <button class="tool" id="hintBtn"><span class="qubi-mini" aria-hidden="true"></span><span data-i18n="hint"></span></button>
          <span class="keys" data-i18n="keys"></span>
        </div>
      </div>

      <div class="actions-row" id="sceneActions"></div>
    </div>
  </section>

  <!-- results -->
  <section class="screen results" id="results" hidden>
    <div class="results-card">
      <p class="kicker">Brot kaufen · A1</p>
      <h1 data-i18n="result_title"></h1>
      <div class="score">
        <svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="track"/><circle cx="60" cy="60" r="52" class="bar" id="scoreArc"/></svg>
        <div><b id="scoreNum">0</b><span>%</span></div>
      </div>
      <p class="score-label" data-i18n="score"></p>
      <p class="meta" id="resMeta"></p>
      <h2 data-i18n="errors"></h2>
      <ul class="errors" id="resErrors"></ul>
      <h2 data-i18n="vocab"></h2>
      <ul class="vocab" id="resVocab"></ul>
      <h2 data-i18n="grammar"></h2>
      <ul class="grammar" id="resGrammar"></ul>
      <div class="actions">
        <button class="btn primary" id="againBtn" data-i18n="replay_mission"></button>
      </div>
      <p class="credits"><a href="credits.html" data-i18n="credits"></a></p>
    </div>
  </section>

  <!-- settings -->
  <dialog id="settings">
    <form method="dialog">
      <h2 data-i18n="settings"></h2>
      <label class="row"><span data-i18n="ui_lang"></span>
        <select id="setLang"><option value="fr">Français</option><option value="en">English</option></select></label>
      <label class="row"><span data-i18n="translation"></span><input type="checkbox" id="setTrans"></label>
      <label class="row"><span data-i18n="subtitles"></span><input type="checkbox" id="setSubs"></label>
      <label class="row"><span data-i18n="vol_voice"></span><input type="range" id="volVoice" min="0" max="1" step="0.05"></label>
      <label class="row"><span data-i18n="vol_sfx"></span><input type="range" id="volSfx" min="0" max="1" step="0.05"></label>
      <label class="row"><span data-i18n="vol_ambience"></span><input type="range" id="volAmb" min="0" max="1" step="0.05"></label>
      <div class="dlg-actions">
        <button class="btn ghost" value="restart" id="restartBtn" data-i18n="restart"></button>
        <button class="btn primary" value="close" data-i18n="back"></button>
      </div>
    </form>
  </dialog>
</div>

<script src="data/brot_kaufen.js"></script>
<script src="js/mission.js"></script>
<script src="js/i18n.js"></script>
<script src="js/app.js"></script>
</body>
</html>
